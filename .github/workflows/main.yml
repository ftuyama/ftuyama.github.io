name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - run: npm install

    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps

    - name: Run eslint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Run tests
      run: npm test

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: github-pages
      url: https://ftuyama.github.io

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - run: npm install

    - name: Build
      run: npm run build

    # Pushes the Vite output to orphan branch `gh-pages`. Set GitHub Pages
    # "Build and deployment" source to branch `gh-pages` / folder `/` (not
    # `master`, which serves the dev index.html with /src/main.ts).
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: dist
        clean: true
        single-commit: true
